<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">VideoAgent technical architecture</title>
  <desc id="desc">A five-layer architecture from the director workspace through API control, Agent planning, asynchronous generation, and persisted final delivery.</desc>
  <defs>
    <style>
      .bg{fill:#07111f}.panel{fill:#0b192b;stroke:#29405e;stroke-width:1.4}.card{fill:#10243a;stroke:#36516f;stroke-width:1.1}
      .hot{fill:#12365a;stroke:#68a6ff;stroke-width:1.7}.ink{fill:#f2f7ff}.soft{fill:#9db1c9}.blue{fill:#7bbcff}.cyan{fill:#72dff5}
      .kicker{font:700 14px 'Cascadia Code',Consolas,monospace;letter-spacing:1.3px}.title{font:700 43px 'Segoe UI',Arial,sans-serif}
      .sub{font:400 18px 'Segoe UI',Arial,sans-serif}.col{font:700 14px 'Cascadia Code',Consolas,monospace;letter-spacing:1px}
      .head{font:700 22px 'Segoe UI',Arial,sans-serif}.card-title{font:700 17px 'Segoe UI',Arial,sans-serif}.copy{font:400 13px 'Segoe UI',Arial,sans-serif}
      .legend{font:600 12px 'Cascadia Code',Consolas,monospace;letter-spacing:.4px}.flow{stroke:#4c8ee8;stroke-width:2;fill:none}
      .flow-text{font:600 11px 'Cascadia Code',Consolas,monospace}.dash{stroke:#5a7595;stroke-width:1;stroke-dasharray:6 6}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#4c8ee8"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1000"/>
  <rect x="38" y="30" width="48" height="48" fill="#153d68" stroke="#72b7ff" stroke-width="1.5"/>
  <path d="M56 43L75 54L56 65Z" fill="#7bbcff"/>
  <text class="kicker blue" x="108" y="43">VIDEOAGENT / TECHNICAL ARCHITECTURE</text>
  <text class="title ink" x="108" y="78">From creative intent to final cut: one controlled path</text>
  <text class="sub soft" x="40" y="111">The director owns intent, the Agent plans within bounds, and runtime control isolates state, tool calls, cost, and delivery.</text>

  <!-- 01 Experience -->
  <rect class="panel" x="30" y="145" width="315" height="735"/>
  <text class="col blue" x="52" y="176">01 / EXPERIENCE</text>
  <text class="head ink" x="52" y="207">Director Workspace</text>
  <text class="copy soft" x="52" y="230">Browser and product surface</text>
  <rect class="card" x="52" y="250" width="271" height="78"/>
  <text class="card-title ink" x="68" y="278">Product UI</text><text class="copy soft" x="68" y="301">Next.js · React · TypeScript</text>
  <rect class="card" x="52" y="340" width="271" height="78"/>
  <text class="card-title ink" x="68" y="368">Chat + Approvals</text><text class="copy soft" x="68" y="391">director messages · stage gates</text>
  <rect class="card" x="52" y="430" width="271" height="78"/>
  <text class="card-title ink" x="68" y="458">Editable Direction</text><text class="copy soft" x="68" y="481">Settings · Outline · Script</text>
  <rect class="card" x="52" y="520" width="271" height="78"/>
  <text class="card-title ink" x="68" y="548">Editable Vision</text><text class="copy soft" x="68" y="571">Characters · Scenes · Shots</text>
  <rect class="card" x="52" y="610" width="271" height="78"/>
  <text class="card-title ink" x="68" y="638">Assets + Versions</text><text class="copy soft" x="68" y="661">results · references · final cuts</text>
  <rect class="hot" x="52" y="700" width="271" height="78"/>
  <text class="card-title ink" x="68" y="728">Collaboration</text><text class="copy soft" x="68" y="751">view/edit access · publish</text>

  <!-- 02 Control -->
  <rect class="panel" x="385" y="145" width="315" height="735"/>
  <text class="col blue" x="407" y="176">02 / CONTROL PLANE</text>
  <text class="head ink" x="407" y="207">FastAPI</text>
  <text class="copy soft" x="407" y="230">Python backend · async REST</text>
  <rect class="card" x="407" y="250" width="271" height="78"/>
  <text class="card-title ink" x="423" y="278">Auth + Isolation</text><text class="copy soft" x="423" y="301">HttpOnly · CSRF · rate limit</text>
  <rect class="card" x="407" y="340" width="271" height="78"/>
  <text class="card-title ink" x="423" y="368">REST API</text><text class="copy soft" x="423" y="391">projects · messages · jobs · assets</text>
  <rect class="hot" x="407" y="430" width="271" height="78"/>
  <text class="card-title ink" x="423" y="458">Workflow Gates</text><text class="copy soft" x="423" y="481">concept → outline → script → generate</text>
  <rect class="card" x="407" y="520" width="271" height="78"/>
  <text class="card-title ink" x="423" y="548">Credit Boundary</text><text class="copy soft" x="423" y="571">estimate · reserve · refund</text>
  <rect class="card" x="407" y="610" width="271" height="78"/>
  <text class="card-title ink" x="423" y="638">Pydantic Contracts</text><text class="copy soft" x="423" y="661">request and response validation</text>
  <rect class="card" x="407" y="700" width="271" height="78"/>
  <text class="card-title ink" x="423" y="728">Project State</text><text class="copy soft" x="423" y="751">ownership · memberships · versions</text>

  <!-- 03 Agent -->
  <rect class="panel" x="740" y="145" width="315" height="735"/>
  <text class="col blue" x="762" y="176">03 / INTELLIGENCE</text>
  <text class="head ink" x="762" y="207">Agent + Skills</text>
  <text class="copy soft" x="762" y="230">Bounded planning and production policy</text>
  <rect class="card" x="762" y="250" width="271" height="78"/>
  <text class="card-title ink" x="778" y="278">Context + Memory</text><text class="copy soft" x="778" y="301">brief · history · resources · state</text>
  <rect class="card" x="762" y="340" width="271" height="78"/>
  <text class="card-title ink" x="778" y="368">Skill Resolution</text><text class="copy soft" x="778" y="391">owner-scoped instructions</text>
  <rect class="hot" x="762" y="430" width="271" height="78"/>
  <text class="card-title ink" x="778" y="458">LangGraph Planner</text><text class="copy soft" x="778" y="481">plan_storyboard · no paid tools</text>
  <rect class="card" x="762" y="520" width="271" height="78"/>
  <text class="card-title ink" x="778" y="548">StoryboardPlan</text><text class="copy soft" x="778" y="571">characters · scenes · shots</text>
  <rect class="card" x="762" y="610" width="271" height="78"/>
  <text class="card-title ink" x="778" y="638">State Update</text><text class="copy soft" x="778" y="661">persist · version · re-plan</text>
  <rect class="card" x="762" y="700" width="271" height="78"/>
  <text class="card-title ink" x="778" y="728">Agent Hooks</text><text class="copy soft" x="778" y="751">durable execution trace</text>

  <!-- 04 Generation -->
  <rect class="panel" x="1095" y="145" width="315" height="735"/>
  <text class="col blue" x="1117" y="176">04 / GENERATION</text>
  <text class="head ink" x="1117" y="207">Runtime + Providers</text>
  <text class="copy soft" x="1117" y="230">Asynchronous, replaceable execution</text>
  <rect class="card" x="1117" y="250" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="278">Provider Resolver</text><text class="copy soft" x="1133" y="301">capability · model · references</text>
  <rect class="hot" x="1117" y="340" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="368">Model Catalogue</text><text class="copy soft" x="1133" y="391">16 Pippit/Kling models + Auto</text>
  <rect class="card" x="1117" y="430" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="458">Pippit CLI</text><text class="copy soft" x="1133" y="481">production video provider</text>
  <rect class="card" x="1117" y="520" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="548">Kling CLI / MCP</text><text class="copy soft" x="1133" y="571">production video provider</text>
  <rect class="card" x="1117" y="610" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="638">Celery + Redis</text><text class="copy soft" x="1133" y="661">jobs · retry · backoff polling</text>
  <rect class="card" x="1117" y="700" width="271" height="78"/>
  <text class="card-title ink" x="1133" y="728">Mock Provider</text><text class="copy soft" x="1133" y="751">deterministic tests</text>

  <!-- 05 Delivery and state -->
  <rect class="panel" x="1450" y="145" width="320" height="735"/>
  <text class="col blue" x="1472" y="176">05 / DELIVERY + STATE</text>
  <text class="head ink" x="1472" y="207">Artifacts + Review</text>
  <text class="copy soft" x="1472" y="230">Durable source of truth and delivery</text>
  <rect class="card" x="1472" y="250" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="278">PostgreSQL / SQLite</text><text class="copy soft" x="1488" y="301">relational source of truth</text>
  <rect class="card" x="1472" y="340" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="368">Media Store / MinIO</text><text class="copy soft" x="1488" y="391">image · video · audio · checksums</text>
  <rect class="card" x="1472" y="430" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="458">FFmpeg</text><text class="copy soft" x="1488" y="481">captions · soundtrack · ratios</text>
  <rect class="hot" x="1472" y="520" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="548">Final Cut Review</text><text class="copy soft" x="1488" y="571">character · style · prompt · temporal</text>
  <rect class="card" x="1472" y="610" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="638">Private Delivery</text><text class="copy soft" x="1488" y="661">download · expiring share</text>
  <rect class="card" x="1472" y="700" width="276" height="78"/>
  <text class="card-title ink" x="1488" y="728">Publishing</text><text class="copy soft" x="1488" y="751">collaboration · public feed</text>

  <!-- Flow arrows -->
  <path class="flow" d="M345 560H385" marker-end="url(#arrow)"/><text class="flow-text soft" x="349" y="550">HTTPS</text>
  <path class="flow" d="M700 560H740" marker-end="url(#arrow)"/><text class="flow-text soft" x="706" y="550">plan</text>
  <path class="flow" d="M1055 560H1095" marker-end="url(#arrow)"/><text class="flow-text soft" x="1058" y="550">job</text>
  <path class="flow" d="M1410 560H1450" marker-end="url(#arrow)"/><text class="flow-text soft" x="1412" y="550">assets</text>
  <path class="dash" d="M80 896H1720"/>
  <text class="legend blue" x="48" y="925">SYNC</text><text class="legend soft" x="105" y="925">Browser ↔ FastAPI</text>
  <text class="legend blue" x="305" y="925">ASYNC</text><text class="legend soft" x="365" y="925">FastAPI → Celery/Redis → Providers</text>
  <text class="legend blue" x="735" y="925">DURABLE</text><text class="legend soft" x="812" y="925">database + media store</text>
  <text class="legend blue" x="1080" y="925">BOUNDARIES</text><text class="legend soft" x="1180" y="925">user isolation · explicit approval · cost · traceability</text>
</svg>
